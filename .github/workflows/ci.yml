name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Backend Verification (.NET 10 Solution)
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Build & Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore SistemaInventarioVentas.slnx

      - name: Build Solution
        run: dotnet build SistemaInventarioVentas.slnx --no-restore --configuration Release

      - name: Run Backend Tests
        run: dotnet test SistemaInventarioVentas.slnx --no-build --configuration Release --verbosity normal

  # ----------------------------------------------------------------------------
  # Frontend Verification (Angular 22 & Vitest)
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Build & Tests (Angular 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test -- --watch=false

      - name: Build Production Distribution
        run: npm run build
